<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #f87171;
    }
    .title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .msg { font-size: 14px; color: #5a5a75; margin-bottom: 24px; }
    button {
      padding: 10px 24px; background: #7c3aed; border: none;
      border-radius: 8px; color: #fff; font-size: 14px;
      cursor: pointer; font-family: inherit;
    }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="title">❌ Could not connect</div>
  <div class="msg">The server failed to start. Check your .env and Docker.</div>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
