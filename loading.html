<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #a78bfa;
    }
    .logo { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    .sub { font-size: 14px; color: #5a5a75; margin-bottom: 40px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(124,58,237,0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status { margin-top: 20px; font-size: 13px; color: #5a5a75; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">✦ 恵 ¦ Ebisu</div>
  <div class="sub">Dashboard</div>
  <div class="spinner"></div>
  <div class="status">Starting services...</div>
</body>
</html>
